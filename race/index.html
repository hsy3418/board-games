<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe2a3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>兔子赛跑 Bunny Race 🐰🦊</title>
<meta property="og:title" content="Bunny Race 兔子赛跑">
<meta property="og:description" content="Dice, choices and dirty tricks for two. 两只兔子、撞人、放香蕉皮！">
<style>
:root{--ink:#2b2418;--muted:#7a6f5c;--accent:#ef7d32;--accent2:#d9601b;--green:#3f8a3a;--blue:#2f72c4;--card:#fffaf0;--road:#e3c38f;--road2:#cfa86b;--rabbit:#ff8fb1;--fox:#ff8a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button{touch-action:manipulation}
body{margin:0;font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:env(safe-area-inset-top) 10px 28px;min-height:100vh;
  background:radial-gradient(circle at 20% 10%,#f6ffe9 0,#e3f4cf 35%,transparent 36%),radial-gradient(circle at 85% 30%,#eefbe0 0,transparent 30%),linear-gradient(180deg,#d9f0c4,#bfe2a3 70%,#a9d38d)}
.wrap{width:100%;max-width:500px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 6px}
h1{font-size:21px;margin:0;letter-spacing:.5px;text-shadow:0 2px 0 #fff8}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;color:inherit;transition:transform .08s}
button:active:not(:disabled){transform:scale(.96)}
.link{background:none;color:var(--muted);font-size:14px;padding:6px 4px}
/* players */
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}
.pl{position:relative;background:#fffdf5d9;border-radius:18px;padding:9px 11px;font-size:14px;line-height:1.35;box-shadow:0 3px 0 #0000000f,0 6px 14px #0000000d;border:3px solid transparent;transition:border-color .2s,transform .2s}
.pl.turn{border-color:var(--accent);transform:translateY(-2px)}
.pl.turn::after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:var(--accent)}
#pl1{background:linear-gradient(135deg,#fff,#ffe8f0)}#pl2{background:linear-gradient(135deg,#fff,#ffeedd)}
.pl .top{display:flex;align-items:center;gap:7px}.pl .ic{font-size:26px}
.pl b{font-size:16px}
.pl small{color:var(--muted);font-size:12px}
.homes{display:inline-flex;gap:3px;vertical-align:-2px}.homes i{width:10px;height:10px;border-radius:50%;background:#0001;display:inline-block}.homes i.on{background:var(--green)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-left:3px;vertical-align:1px}.live.on{background:#2e9d32;box-shadow:0 0 0 3px #2e9d3233}
/* board */
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);padding:6px;border-radius:22px;
  background:radial-gradient(circle at 30% 20%,#9fd17f 0 2px,transparent 3px) 0 0/22px 22px,radial-gradient(circle at 70% 60%,#8cc56b 0 2px,transparent 3px) 0 0/26px 26px,linear-gradient(160deg,#a7d98a,#86c46a);
  box-shadow:inset 0 0 0 4px #ffffff55,0 8px 0 #6aa64f,0 14px 24px #0000002a}
.road{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);pointer-events:none}
.sq{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.stone{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffaf0,#f1dfbd 70%,#e2c896);box-shadow:inset 0 -3px 0 #0000001c,0 2px 3px #0000002b;display:flex;align-items:center;justify-content:center}
.sq.carrot .stone{background:radial-gradient(circle at 35% 30%,#fff3e3,#ffc58f 75%)}
.sq.gift .stone{background:radial-gradient(circle at 35% 30%,#fbf0ff,#d9b8f5 75%)}
.sq.hole .stone{background:radial-gradient(circle at 50% 55%,#5a4632,#8b7154 60%,#c8ad83)}
.sq.rocket .stone{background:radial-gradient(circle at 35% 30%,#eef6ff,#a9cdf7 75%)}
.sq.safe .stone{background:radial-gradient(circle at 35% 30%,#f2ffe9,#a8de8c 75%)}
.sq.start .stone,.sq.end .stone{inset:2%;border-radius:30%}
.sq.start .stone{background:radial-gradient(circle at 35% 30%,#fff,#bfe0ff 80%)}
.sq.end .stone{background:repeating-conic-gradient(#2b2418 0 25%,#fff 0 50%) 0 0/12px 12px;box-shadow:0 0 0 3px #fff,0 3px 6px #0004}
.sq .num{position:absolute;top:-1px;left:1px;font-size:9px;color:#fffd;text-shadow:0 1px 1px #0006;z-index:1}
.sq .lb{font-size:min(4.6vw,20px);z-index:1;line-height:1}
.sq.end .lb{background:#fff;border-radius:50%;padding:2px}
.sq .item{position:absolute;right:-2px;top:-3px;font-size:min(4.4vw,19px);z-index:4;filter:drop-shadow(0 2px 1px #0005);animation:pop .35s}
.sq.target .stone{box-shadow:0 0 0 3px var(--blue),0 0 14px var(--blue);animation:pulse 1s infinite}
.sq .mark{position:absolute;inset:4%;border:3px dashed var(--blue);border-radius:50%;display:flex;align-items:flex-end;justify-content:center;font-size:12px;color:#fff;font-weight:800;z-index:5;pointer-events:none;line-height:1;animation:spin 6s linear infinite}
.sq .mark b{background:var(--blue);border-radius:8px;padding:1px 4px;margin-bottom:-6px;animation:spin 6s linear infinite reverse}
.tok{position:absolute;width:62%;height:62%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(4.6vw,20px);z-index:6;line-height:1;background:#fff;box-shadow:0 3px 0 #0003,0 4px 8px #0003;transition:left .1s,top .1s}
.tok.p1{border:3px solid var(--rabbit)}.tok.p2{border:3px solid var(--fox)}
.tok i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font-size:9px;font-weight:800;color:#fff;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.tok.p1 i{background:var(--rabbit)}.tok.p2 i{background:var(--fox)}
.tok.k0{left:-2%;bottom:-2%}.tok.k1{right:-2%;top:-2%}.tok.k2{right:-2%;bottom:-2%}.tok.k3{left:-2%;top:-2%}
.tok.solo{left:19%;top:19%}
.tok.hop{animation:hop .2s ease-out}
.tok.mine.ready{animation:bob 1.1s ease-in-out infinite}
.burst{position:absolute;inset:-30%;z-index:9;pointer-events:none;font-size:min(9vw,40px);display:flex;align-items:center;justify-content:center;animation:burst .8s ease-out forwards}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-35%)}100%{transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--blue),0 0 2px var(--blue)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{0%{transform:scale(.2);opacity:1}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
/* log / hint */
.log{min-height:52px;text-align:center;font-size:15px;margin:12px 2px 6px;line-height:1.45;background:#fffdf5cc;border-radius:16px;padding:8px 10px;box-shadow:0 2px 0 #0000000d}
.log b{color:var(--accent2)}
.hint{text-align:center;font-size:14px;color:var(--blue);min-height:20px;margin-bottom:4px;font-weight:600}
/* cards */
.hand{display:flex;gap:8px;justify-content:center;margin:6px 0;min-height:70px;flex-wrap:wrap}
.cardb{position:relative;background:linear-gradient(160deg,#fffdf6,#fff1d6);border:2px solid #f0d9a8;border-radius:14px;padding:8px 8px 7px;width:31%;min-width:96px;font-size:12.5px;line-height:1.25;text-align:center;box-shadow:0 4px 0 #e5c88c,0 6px 10px #0000001a}
.cardb .e{font-size:28px;display:block;margin-bottom:2px}
.cardb b{font-size:14px}
.cardb:disabled{opacity:.5;box-shadow:0 2px 0 #e5c88c}
.cardb.passive{background:linear-gradient(160deg,#f7fbff,#dfeeff);border-color:#b9d4f3;box-shadow:0 4px 0 #a9c6ea}
.cardb.armed{border-color:var(--blue);background:linear-gradient(160deg,#eef6ff,#d6e8ff);transform:translateY(-4px)}
.empty{color:var(--muted);font-size:13px;align-self:center}
/* dice + buttons */
.rollrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.roll{flex:1;padding:17px;font-size:19px;background:linear-gradient(180deg,#ff9a4d,var(--accent));color:#fff;font-weight:700;box-shadow:0 5px 0 var(--accent2),0 8px 14px #0002;letter-spacing:.5px}
.roll:disabled{background:#d8cbb9;box-shadow:0 4px 0 #bfae96;color:#fffc}
.die{width:56px;height:56px;border-radius:14px;background:linear-gradient(145deg,#fff,#f1ece2);box-shadow:inset 0 -4px 0 #0000001a,0 4px 8px #0003;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;flex:none;position:relative}
.die i{width:10px;height:10px;border-radius:50%;background:#2b2418;align-self:center;justify-self:center;opacity:0}
.die i.on{opacity:1}
.die.rolling{animation:tumble .5s ease-out}
.die .plus{position:absolute;right:-8px;top:-8px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;border-radius:10px;padding:1px 5px}
@keyframes tumble{0%{transform:rotate(0) scale(.8)}50%{transform:rotate(200deg) scale(1.1)}100%{transform:rotate(360deg) scale(1)}}
.picks{display:flex;gap:10px;margin-top:10px;align-items:center}
.picks button{flex:1;padding:10px 6px;font-size:15px;background:#fff;border:3px solid var(--blue);color:var(--ink);box-shadow:0 4px 0 #2459a0;font-weight:600}
.picks button .d{font-size:26px;display:block;line-height:1.2}
.picks button:disabled{opacity:.45;border-color:#ccc;box-shadow:0 3px 0 #bbb}
.picks button.rm{padding:6px 0;box-shadow:0 3px 0 #2459a0}.picks button.rm .d{font-size:28px}
/* panels */
.card{background:#fffdf5;border-radius:18px;padding:16px;margin-top:10px;line-height:1.55;font-size:15px;box-shadow:0 4px 0 #0000000f}
.card h2{font-size:17px;margin:0 0 8px}
.card ul{padding-left:18px;margin:6px 0}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid #ead9b5;background:#fff;margin-top:6px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:13px;background:#f1e6cc;font-weight:600}
.row button.on{background:var(--green);color:#fff;box-shadow:0 4px 0 #2d6a29}
.big{width:100%;padding:15px;margin-top:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;box-shadow:0 5px 0 #2d6a29}
.muted{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2b2418;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:50}
.toast.on{opacity:1}
.win{font-size:21px;font-weight:800}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:40;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.board{grid-template-columns:repeat(8,1fr)}
.sq.deco{font-size:min(3.6vw,15px);opacity:.75}
.sq.choice{cursor:pointer}
.tok.frozen{filter:saturate(.2) brightness(1.1);box-shadow:0 0 0 3px #9fd8ff,0 3px 6px #0003}
.tok.frozen::after{content:"🧊";position:absolute;left:-6px;top:-8px;font-size:12px}
.tok.ready{animation:bob 1.1s ease-in-out infinite}
.sq .mark.via{border-color:#8e44ad}.sq .mark.via b{background:#8e44ad}
.sq.bridge .stone{background:radial-gradient(circle at 35% 30%,#fff4e0,#d7a86e 75%);border-radius:30%}
.picks{display:flex;gap:10px;align-items:center}
.pbtns{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtns.six{grid-template-columns:repeat(6,1fr)}
.pbtns button.via{border-color:#8e44ad;box-shadow:0 4px 0 #6c3483}
.pbtns button.wide{grid-column:1/-1;padding:16px}
.cardb.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 #e5c88c,0 0 0 4px #ffd54f}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><h1 id="hTitle"></h1><div><button class="link" id="bLang"></button><button class="link" id="bRules"></button><button class="link" id="bNew"></button></div></header>

<section id="setup" class="hidden"><div class="card">
  <h2 data-t="newGame"></h2>
  <label data-t="yourName"></label><input id="nA" maxlength="14">
  <label data-t="theirName"></label><input id="nB" maxlength="14">
  <label data-t="whoFirst"></label>
  <div class="row"><button id="fMe" class="on" data-t="me"></button><button id="fThem" data-t="them"></button></div>
  <p class="muted" data-t="setupNote"></p>
  <button class="big" id="bStart" data-t="start"></button>
</div></section>

<section id="game" class="hidden">
  <div class="players">
    <div class="pl" id="pl1"><div class="top"><span class="ic">🐰</span><b id="n1"></b></div><small id="s1"></small></div>
    <div class="pl" id="pl2"><div class="top"><span class="ic">🦊</span><b id="n2"></b></div><small id="s2"></small></div>
  </div>
  <div class="board" id="board"></div>
  <div class="log" id="log"></div>
  <div class="hint" id="hint"></div>
  <div class="hand" id="hand"></div>
  <div class="picks hidden" id="picks"></div>
  <div class="rollrow" id="rollrow"><div class="die" id="die"></div><button class="roll" id="bRoll"></button></div>
  <p class="muted" style="text-align:center;margin:10px 0 0"><button class="link" id="bSwap"></button> · <button class="link" id="bMine"></button></p>
  <div class="row hidden" id="endRow"><button class="on" id="bRematch" data-t="rematch"></button></div>
  <div class="card hidden" id="invite">
    <b data-t="invTitle"></b>
    <input id="invUrl" readonly onclick="this.select()">
    <div class="row"><button id="invShare" class="on">📤 Share</button><button id="invCopy" data-t="copy"></button></div>
    <p class="muted" data-t="invNote"></p>
  </div>
</section>

<section id="rules" class="hidden"><div class="card" id="rulesBody"></div><button class="big" id="bRulesOk" data-t="gotIt"></button></section>
</div>
<div class="toast" id="toast"></div>

<script>
// ================= rules engine v4 (pure, deterministic) =================
// Track: 35 main nodes (0 start .. 34 finish) on an 8x7 grid, plus two bridge shortcuts.
const END = 34;
const NODE_RC = (() => {            // node -> [row, col] (row 0 = top)
  const m = [];
  for (let c = 0; c < 8; c++) m.push([6, c]);       // 0..7
  m.push([5, 7]);                                    // 8
  for (let c = 7; c >= 0; c--) m.push([4, c]);      // 9..16
  m.push([3, 0]);                                    // 17
  for (let c = 0; c < 8; c++) m.push([2, c]);       // 18..25
  m.push([1, 7]);                                    // 26
  for (let c = 7; c >= 0; c--) m.push([0, c]);      // 27..34
  m.push([3, 2]);                                    // 35 bridge A: 14 -> 35 -> 20
  m.push([1, 5]);                                    // 36 bridge B: 23 -> 36 -> 29
  return m;
})();
const NODES = NODE_RC.length;
const NEXT = (() => { const n = []; for (let i = 0; i < END; i++) n[i] = [i + 1]; n[END] = []; n[14] = [15, 35]; n[35] = [20]; n[23] = [24, 36]; n[36] = [29]; return n; })();
const PREV = (() => { const p = [null]; for (let i = 1; i <= END; i++) p[i] = i - 1; p[35] = 14; p[36] = 23; return p; })();
const BRIDGE = new Set([35, 36]);
const SPECIAL = {2:'rocket',4:'carrot',6:'gift',8:'safe',12:'gift',13:'hole',17:'safe',19:'gift',24:'hole',26:'safe',28:'carrot',30:'gift',35:'bridge',36:'bridge'};
const BUMP = 6;
const CARDS = ['banana','wall','remote','boost','shield','hook','snail','freeze','double','reroll'];   // draw digit 0..9 = one each
const TARGET_AHEAD = c => c === 'banana' || c === 'wall';
const TARGET_RUNNER = c => c === 'hook' || c === 'freeze';
const other = p => 3 - p;

function initState(G){
  return {pos:[null,[0,0],[0,0]], hand:[null,[CARDS[G.h[0]]],[CARDS[G.h[1]]]], items:{}, turn:G.first, phase:'pre',
          boost:0, used:false, die:0, draw:0, natural:false, dbl:false, snail:[0,0,0], frozen:[null,[],[]], winner:0, events:[], carry:[], fx:[]};
}
const isHome = q => q === END;
let evHook = null;
function ev(S, key, ...args){ S.events.push(evHook ? evHook(key, ...args) : key); }
function useShield(S, p){ const k = S.hand[p].indexOf('shield'); if (k < 0) return false; S.hand[p].splice(k, 1); ev(S, 'shield', p); return true; }
function back(q, k){ for (let s = 0; s < k && q > 0; s++) q = PREV[q]; return q; }

// all places runner i of player p can stop with k steps (branching at forks). Each: {to, via, wall, passed}
function reach(S, p, from, k, mainOnly){
  if (isHome(from)) return [];
  const out = [], shield0 = S.hand[p].includes('shield');
  (function walk(q, left, shield, passed, via){
    if (left === 0){ out.push({to:q, via, wall:false, passed}); return; }
    const nx = mainOnly ? NEXT[q].slice(0, 1) : NEXT[q];
    if (!nx.length) return;                          // at finish with steps left: overshoot, illegal
    for (const n of nx){
      const v = via || BRIDGE.has(n);
      if (S.items[n] === 'wall' && n !== END){
        if (shield) walk(n, left - 1, false, n, v);
        else out.push({to:n, via:v, wall:true, passed});
      } else walk(n, left - 1, shield, passed, v);
    }
  })(from, k, shield0, null, false);
  const seen = new Set();
  return out.filter(o => { const key = o.to + ':' + o.via; if (seen.has(key)) return false; seen.add(key); return true; });
}
function options(S){
  const p = S.turn, k = S.die + S.boost;
  if (S.dbl) return [{i:9, to:-1, via:false}];
  const out = [];
  for (const i of [0, 1]){ if (S.frozen[p].includes(i)) continue; for (const o of reach(S, p, S.pos[p][i], k)) out.push(Object.assign({i}, o)); }
  return out;
}
function canDouble(S){ const p = S.turn, k = S.die + S.boost; return [0, 1].some(i => !S.frozen[p].includes(i) && reach(S, p, S.pos[p][i], k, true).length); }
function aheadNodes(S, p, steps){
  const set = new Set();
  for (const q of S.pos[p]){ if (isHome(q)) continue; (function w(n, d){ if (d === 0) return; for (const m of NEXT[n]){ set.add(m); w(m, d - 1); } })(q, steps); }
  return set;
}
function validTargets(S, me, card){
  const op = other(me);
  if (TARGET_AHEAD(card)) return [...aheadNodes(S, op, 6)].filter(n => n !== END && !S.items[n] && !S.pos[me].includes(n) && !S.pos[op].includes(n) && SPECIAL[n] !== 'safe').sort((a, b) => a - b);
  if (card === 'hook') return [...new Set(S.pos[op].filter(q => q > 0 && !isHome(q)))];
  if (card === 'freeze') return [...new Set(S.pos[op].filter(q => !isHome(q)))];
  return [];
}
function endTurn(S, extra){
  S.frozen[S.turn] = [];
  S.boost = 0; S.used = false; S.die = 0; S.phase = 'pre'; S.dbl = false; S.natural = false;
  if (!extra) S.turn = other(S.turn);
}
function afterRoll(S){
  const me = S.turn;
  if (S.dbl ? !canDouble(S) : !options(S).length){ ev(S, 'noMove', me); endTurn(S, false); return; }
  S.phase = 'pick'; S.carry = S.events.slice();
}
// land runner i of player me on node `to` after a move; returns true if this landing earns another turn
function land(S, me, i, opt){
  const op = other(me), P = S.pos[me];
  P[i] = opt.to;
  if (opt.passed != null){ delete S.items[opt.passed]; useShield(S, me); }
  if (opt.wall){ delete S.items[opt.to]; ev(S, 'walled', me); }
  let extra = false;
  if (isHome(P[i])){ ev(S, 'home', me, i); S.fx.push({t:'🎉', at:END}); return false; }
  if (S.items[P[i]] === 'banana'){ delete S.items[P[i]]; if (!useShield(S, me)){ S.fx.push({t:'🍌', at:P[i]}); P[i] = back(P[i], 3); ev(S, 'slipped', me); } }
  else {
    const sp = SPECIAL[P[i]];
    if (sp && sp !== 'safe') ev(S, 'sq', sp);
    if (sp === 'carrot') extra = true;
    else if ((sp === 'hole' || sp === 'bridge') && !useShield(S, me)){ S.fx.push({t: sp === 'hole' ? '🕳️' : '💦', at:P[i]}); P[i] = back(P[i], 3); }
    else if (sp === 'gift'){ if (S.hand[me].length >= 3) ev(S, 'handFull'); else { const c = CARDS[S.draw]; S.hand[me].push(c); ev(S, 'drew', c); } }
    else if (sp === 'rocket'){ const r = reach(S, me, P[i], 3, true)[0]; if (r){ P[i] = r.to; if (r.passed != null){ delete S.items[r.passed]; useShield(S, me); } if (r.wall){ delete S.items[r.to]; ev(S, 'walled', me); } } }
  }
  const at = P[i];

  busy = false;
}
function buzz(){ try { navigator.vibrate && navigator.vibrate(60); } catch {} }



// ================= UI =================
const COLS = 8, ROWS = 7;
const gridOf = n => NODE_RC[n][0] * COLS + NODE_RC[n][1];
// undirected path between two nodes, for step-by-step animation (bridges included)
const ADJ = (() => { const a = [...Array(NODES)].map(() => []); NEXT.forEach((ns, i) => (ns || []).forEach(j => { a[i].push(j); a[j].push(i); })); return a; })();
function pathBetween(a, b){
  if (a === b) return [];
  const prev = new Map([[a, -1]]), q = [a];
  while (q.length){ const n = q.shift(); if (n === b) break; for (const m of ADJ[n]) if (!prev.has(m)){ prev.set(m, n); q.push(m); } }
  if (!prev.has(b)) return [b];
  const out = []; for (let n = b; n !== a; n = prev.get(n)) out.unshift(n); return out;
}
let queue = null;   // queue[p][i] = remaining nodes to hop through
function animateTo(){
  if (!queue) queue = [null, [[], []], [[], []]];
  for (const p of [1, 2]) for (const i of [0, 1]){
    const last = queue[p][i].length ? queue[p][i][queue[p][i].length - 1] : shown[p][i];
    if (last !== S.pos[p][i]) queue[p][i].push(...pathBetween(last, S.pos[p][i]));
  }
  clearInterval(animT);
  animT = setInterval(() => {
    let moving = false; hopSet = new Set();
    for (const p of [1, 2]) for (const i of [0, 1]) if (queue[p][i].length){ shown[p][i] = queue[p][i].shift(); moving = true; hopSet.add(p + ':' + i); }
    drawBoard();
    if (!moving){ clearInterval(animT); hopSet = new Set(); drawBoard(); }
  }, 95);
}
let hopSet = new Set();
function roadSVG(){
  const xy = n => { const [r, c] = NODE_RC[n]; return `${c * 100 + 50},${r * 100 + 50}`; };
  const main = [...Array(END + 1).keys()].map(xy).join(' ');
  const br = [[14, 35, 20], [23, 36, 29]].map(s => s.map(xy).join(' '));
  const line = (pts, w, col, extra = '') => `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
  return `<svg class="road" viewBox="0 0 ${COLS * 100} ${ROWS * 100}" preserveAspectRatio="none">
    ${br.map(p => line(p, 40, '#7a5a34', 'opacity=".55"') + line(p, 30, '#c79a63') + line(p, 30, '#8a643a', 'stroke-dasharray="6 9"')).join('')}
    ${line(main, 66, '#b8925a', 'opacity=".5"')}${line(main, 54, '#e8cc98')}${line(main, 4, '#fff7', 'stroke-dasharray="10 16"')}</svg>`;
}
const DECO = ['🌼','🌷','🍄','🌿','🪨','🌸','🐞','🌱'];
function drawBoard(){
  const myTurn = !S.winner && S.turn === mySide;
  const marks = {};
  if (myTurn && S.phase === 'pick' && !S.dbl) options(S).forEach(o => { (marks[o.to] = marks[o.to] || []).push(o); });
  const armedCard = armed >= 0 ? S.hand[mySide][armed] : null;
  const targets = myTurn && armedCard ? validTargets(S, mySide, armedCard) : [];
  const toks = {};
  for (const p of [1, 2]) for (const i of [0, 1]){ const q = shown[p][i]; (toks[q] = toks[q] || []).push([p, i]); }
  const cells = Array(COLS * ROWS).fill(null);
  for (let n = 0; n < NODES; n++){
    const sp = SPECIAL[n];
    const label = n === 0 ? '🏠' : n === END ? '🏁' : sp ? SQ_ICON[sp] : '';
    const cls = ['sq', n === 0 ? 'start' : n === END ? 'end' : '', sp || '', targets.includes(n) ? 'target' : '', marks[n] ? 'choice' : ''].join(' ');
    const list = toks[n] || [];
    const tk = list.map(([p, j], k) => {
      const c = ['tok', 'p' + p, list.length === 1 ? 'solo' : 'k' + k];
      if (hopSet.has(p + ':' + j)) c.push('hop');
      if (S.frozen[p].includes(j)) c.push('frozen');
      if (p === mySide && myTurn && S.phase === 'pick' && (S.dbl || (marks && options(S).some(o => o.i === j)))) c.push('ready');
      return `<span class="${c.join(' ')}">${ICON[p]}<i>${j + 1}</i></span>`;
    }).join('');
    const mk = marks[n] ? `<span class="mark ${marks[n].every(o => o.via) ? 'via' : ''}"><b>${marks[n].map(o => o.i + 1).join('')}</b></span>` : '';
    cells[gridOf(n)] = `<div class="${cls}" data-n="${n}"><div class="stone"><span class="lb">${label}</span></div>${S.items[n] ? `<span class="item">${ITEM_ICON[S.items[n]]}</span>` : ''}${mk}${tk}</div>`;
  }
  for (let g = 0; g < cells.length; g++) if (!cells[g]) cells[g] = `<div class="sq deco"><span>${(g * 7 + 3) % 5 === 0 ? DECO[g % DECO.length] : ''}</span></div>`;
  $('board').innerHTML = roadSVG() + cells.join('');
}
function renderDie(v, plus, rolling){
  const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const on = new Set(PIPS[v] || []);
  const el = $('die'); if (!el) return;
  el.innerHTML = [...Array(9)].map((_, k) => `<i class="${on.has(k) ? 'on' : ''}"></i>`).join('') + (plus ? `<span class="plus">+${plus}</span>` : '');
  if (rolling){ el.classList.remove('rolling'); void el.offsetWidth; el.classList.add('rolling'); }
}
function rollAnim(final, plus){
  let k = 0; const iv = setInterval(() => { renderDie(1 + (k % 6), 0, false); if (++k > 7){ clearInterval(iv); renderDie(final, plus, false); } }, 55);
  renderDie(final, plus, true);
}
function bursts(fx){
  (fx || []).forEach((f, n) => setTimeout(() => {
    const cell = document.querySelector(`.sq[data-n="${f.at}"]`); if (!cell) return;
    const b = document.createElement('span'); b.className = 'burst'; b.textContent = f.t; cell.appendChild(b);
    setTimeout(() => b.remove(), 900);
    if (f.t === '💥' && navigator.vibrate) try { navigator.vibrate([40, 30, 40]); } catch {}
  }, 450 + n * 150));
}
let confettiDone = '';
function confetti(){
  const colors = ['#ff8fb1','#ff8a2a','#ffd54f','#4fc3f7','#81c784','#ba68c8'];
  for (let k = 0; k < 70; k++){
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = colors[k % colors.length];
    d.style.animationDuration = 2 + Math.random() * 2 + 's'; d.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 4800);
  }
}
$('board').onclick = e => {
  const sq = e.target.closest('.sq'); if (!sq || sq.dataset.n == null) return;
  const n = +sq.dataset.n;
  if (armed >= 0){ const c = S.hand[mySide][armed]; if (validTargets(S, mySide, c).includes(n)) act({t:'C', i:armed, sq:n}); return; }
  if (!S.winner && S.turn === mySide && S.phase === 'pick' && !S.dbl){
    const os = options(S).filter(o => o.to === n);
    if (os.length === 1) act({t:'M', i:os[0].i, to:n});
    else if (os.length > 1) toast(LANG === 'zh' ? '两只都能到这里，点下面的按钮选一只' : 'Both can land here, pick one with the buttons below');
  }
};
function renderPresence(){
  if (!G) return; const op = other(mySide), on = Date.now() - lastSeen < 50000;
  const el = $('pres' + op); if (el) el.innerHTML = `${on ? t('here') : t('away')} <span class="live ${on ? 'on' : ''}"></span>`;
}
function render(){
  applyLang();
  const N = [null, G.a, G.b], C = T[LANG].card;
  $('n1').textContent = N[1]; $('n2').textContent = N[2];
  for (const p of [1, 2]){
    const bits = [];
    if (p === mySide) bits.push(t('you'));
    const nh = S.pos[p].filter(isHome).length;
    bits.push(`🏁 <span class="homes"><i class="${nh > 0 ? 'on' : ''}"></i><i class="${nh > 1 ? 'on' : ''}"></i></span>`);
    bits.push(t('cards')(S.hand[p].length) + (S.hand[p].includes('shield') ? ' ' + t('shielded') : ''));
    if (S.snail[p]) bits.push(t('snailBadge'));
    $('s' + p).innerHTML = bits.join(' · ') + (p !== mySide ? ` · <span id="pres${p}"></span>` : '');
    $('pl' + p).classList.toggle('turn', !S.winner && S.turn === p);
  }
  renderPresence(); drawBoard();
  const myTurn = !S.winner && S.turn === mySide;
  $('log').innerHTML = S.winner ? `<span class="win">${t('won')(esc(N[S.winner]))}</span><br>` + S.events.slice(0, -1).join('<br>')
                     : S.events.length ? S.events.join('<br>') : (myTurn ? t('youTurn') : t('waitingFor')(esc(N[S.turn])));
  let hint = '';
  if (myTurn && armed >= 0) hint = t('placeHint')(C[S.hand[mySide][armed]][0]);
  else if (myTurn && S.phase === 'pick') hint = S.dbl ? '' : t('pickHint');
  else if (myTurn && S.phase === 'remote') hint = t('remoteHint');
  $('hint').textContent = hint;
  const usable = c => myTurn && !S.used && c !== 'shield' && (c === 'reroll' ? S.phase === 'pick' : S.phase === 'pre');
  $('hand').innerHTML = S.hand[mySide].map((c, i) => `<button class="cardb ${c === 'shield' ? 'passive' : ''} ${armed === i ? 'armed' : ''} ${usable(c) && c === 'reroll' ? 'glow' : ''}" data-i="${i}" ${usable(c) ? '' : 'disabled'}><span class="e">${C[c][0]}</span><b>${C[c][1]}</b><br><span class="muted">${C[c][2]}</span></button>`).join('') || `<span class="empty">${t('noCards')}</span>`;
  document.querySelectorAll('.cardb').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, c = S.hand[mySide][i];
    if (TARGET_AHEAD(c) || TARGET_RUNNER(c)){
      if (!validTargets(S, mySide, c).length){ toast(t('noRoom')); return; }
      armed = armed === i ? -1 : i; render(); return;
    }
    armed = -1;
    act({t:'C', i, sq: c === 'reroll' ? rndN(6) : 0});
  });
  const picks = $('picks');
  if (myTurn && S.phase === 'pick'){
    const os = options(S), k = S.die + S.boost;
    const btns = S.dbl ? [`<button data-i="9" data-to="-1" class="wide">${t('both')(k)}</button>`]
      : os.map(o => `<button data-i="${o.i}" data-to="${o.to}" class="${o.via ? 'via' : ''}"><span class="d">${t('piece')(ICON[mySide], o.i)}</span>${o.to === END ? t('toHome') : (o.via ? t('viaBridge') + ' ' : '') + '→ ' + o.to}</button>`);
    picks.innerHTML = `<div class="die" id="die2"></div><div class="pbtns">${btns.join('')}</div>`;
    picks.querySelectorAll('button').forEach(b => b.onclick = () => act({t:'M', i:+b.dataset.i, to:+b.dataset.to}));
    const d2 = $('die2'); const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}; const on = new Set(PIPS[S.die]);
    d2.innerHTML = [...Array(9)].map((_, q) => `<i class="${on.has(q) ? 'on' : ''}"></i>`).join('') + (S.boost ? '<span class="plus">+2</span>' : '');
  } else if (myTurn && S.phase === 'remote'){
    picks.innerHTML = `<div class="pbtns six">${[1,2,3,4,5,6].map(v => `<button data-v="${v}" class="rm"><span class="d">${DICE[v - 1]}</span></button>`).join('')}</div>`;
    picks.querySelectorAll('button').forEach(b => b.onclick = () => act({t:'N', v:+b.dataset.v}));
  }
  picks.classList.toggle('hidden', !(myTurn && (S.phase === 'pick' || S.phase === 'remote')));
  $('rollrow').classList.toggle('hidden', (myTurn && S.phase !== 'pre') || !!S.winner);
  $('bRoll').disabled = !myTurn || S.phase !== 'pre' || armed >= 0;
  $('bRoll').textContent = myTurn ? t('roll') : t('notYour')(N[S.turn]);
  $('endRow').classList.toggle('hidden', !S.winner);
  if (S.winner && confettiDone !== G.id + G.log.length){ confettiDone = G.id + G.log.length; if (S.winner === mySide) confetti(); }
  const otherName = other(mySide) === 1 ? G.a : G.b;
  $('bSwap').textContent = t('swapSide')(ICON[other(mySide)] + ' ' + otherName);
  $('bMine').textContent = t('myLink');
}

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  $('hTitle').textContent = t('title'); $('bLang').textContent = t('lang'); $('bRules').textContent = t('rules'); $('bNew').textContent = t('newG');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('rulesBody').innerHTML = t('rulesHtml');
  $('nA').placeholder = LANG === 'zh' ? '你的名字' : 'Your name'; $('nB').placeholder = LANG === 'zh' ? '对方的名字' : 'Their name';
}
function show(id){ ['setup','game','rules'].forEach(v => $(v).classList.toggle('hidden', v !== id)); }
function toast(s){ const el = $('toast'); el.textContent = s; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2400); }

function showInvite(){
  const url = link(other(mySide));
  $('invUrl').value = url; $('invite').classList.remove('hidden');
  $('invShare').onclick = async () => { if (navigator.share){ try { await navigator.share({title:'Bunny Race', url}); return; } catch (e) { if (e && e.name === 'AbortError') return; } } copyLink(url); };
  $('invCopy').onclick = () => copyLink(url);
}
const hideInvite = () => $('invite').classList.add('hidden');
async function copyLink(url){
  try { await navigator.clipboard.writeText(url); toast(LANG === 'zh' ? '已复制' : 'Copied'); return; } catch {}
  const el = $('invUrl'); el.focus(); el.select(); el.setSelectionRange(0, url.length);
  try { if (document.execCommand('copy')) { toast(LANG === 'zh' ? '已复制' : 'Copied'); return; } } catch {}
  toast(LANG === 'zh' ? '长按上面的链接复制' : 'Tap and hold the link above to copy');
}

const sideKey = id => 'race-side-' + id;
function startGame(a, b, first, side = 1, room = null){
  G = {id:rndId(8), a, b, first, h:[rndN(10), rndN(10)], log:[], room:room || 'race-' + rndId(20)};
  mySide = side; localStorage.setItem(sideKey(G.id), String(side)); armed = -1;
  replay(); shown = copyPos(S.pos); queue = null;
  history.replaceState(null, '', link());
  show('game'); render(); renderDie(6, 0, false); liveConnect();
  if (!room) showInvite();
}
function load(){
  hideInvite();
  const g = readHash();
  if (g === 'old'){ toast(LANG === 'zh' ? '这是旧版本的游戏，开一局新的吧' : 'That link is from the old version, start a new game'); openSetup(); return; }
  if (!g){ openSetup(); return; }
  G = g; armed = -1;
  mySide = +(localStorage.getItem(sideKey(G.id)) || 0);
  if (!mySide){ mySide = g.invited === 1 || g.invited === 2 ? g.invited : 2; localStorage.setItem(sideKey(G.id), String(mySide)); }
  replay(); shown = copyPos(S.pos); queue = null;
  history.replaceState(null, '', link());
  show(localStorage.getItem('race-seen-rules-v4') ? 'game' : 'rules');
  render(); renderDie(S.die || 6, 0, false); liveConnect();
  if (!G.log.length && mySide === 1) showInvite();
}
function openSetup(){ const n = JSON.parse(localStorage.getItem('race-names') || '[]'); $('nA').value = n[0] || ''; $('nB').value = n[1] || ''; applyLang(); show('setup'); }

let firstMe = true;
$('fMe').onclick = () => { firstMe = true; $('fMe').classList.add('on'); $('fThem').classList.remove('on'); };
$('fThem').onclick = () => { firstMe = false; $('fThem').classList.add('on'); $('fMe').classList.remove('on'); };
$('bStart').onclick = () => {
  const a = $('nA').value.trim() || (LANG === 'zh' ? '小兔' : 'Bunny'), b = $('nB').value.trim() || (LANG === 'zh' ? '小狐' : 'Fox');
  localStorage.setItem('race-names', JSON.stringify([a, b])); startGame(a, b, firstMe ? 1 : 2);
};
$('bRoll').onclick = () => act({t:'R', d:rndN(6), x:rndN(10)});
$('bRematch').onclick = async () => {
  const oldId = G.id, loserFirst = other(S.winner);
  startGame(G.a, G.b, loserFirst, mySide, G.room);
  const hash = link().split('#')[1];
  try { await fetch(RELAY + G.room, {method:'POST', body:JSON.stringify({id:oldId, by:mySide, t:'new', hash})}); } catch {}
};
$('bNew').onclick = () => { liveClose(); openSetup(); };
$('bSwap').onclick = () => { if (!G) return; mySide = other(mySide); localStorage.setItem(sideKey(G.id), String(mySide)); armed = -1; toast(t('swapped')(ICON[mySide] + ' ' + (mySide === 1 ? G.a : G.b))); render(); ping(); };
$('bMine').onclick = async () => { if (!G) return; const url = link(mySide); try { await navigator.clipboard.writeText(url); toast(t('myCopied')); } catch { $('invUrl').value = url; $('invite').classList.remove('hidden'); toast(LANG === 'zh' ? '长按上面的链接复制' : 'Tap and hold the link above to copy'); } };
$('bRules').onclick = () => { applyLang(); show('rules'); };
$('bRulesOk').onclick = () => { localStorage.setItem('race-seen-rules-v4', '1'); if (G){ show('game'); render(); } else openSetup(); };
$('bLang').onclick = () => { LANG = LANG === 'zh' ? 'en' : 'zh'; localStorage.setItem('race-lang', LANG); if (G) replay(); applyLang(); if (G && !$('game').classList.contains('hidden')) render(); };
window.addEventListener('hashchange', load);
applyLang();
load();
/* no double-tap zoom: handled by touch-action:manipulation + viewport (board taps use click, so no touchend blocking here) */
</script>
